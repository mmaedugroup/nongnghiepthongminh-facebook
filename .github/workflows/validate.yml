name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON workflows
        run: |
          python -m json.tool pipeline/n8n-workflow-content-pipeline.json >/dev/null
          python -m json.tool pipeline/n8n-workflow-publish-approved.json >/dev/null
          python -m json.tool pipeline/n8n-error-handler-workflow.json >/dev/null

      - name: Validate staging contracts
        run: |
          python pipeline/scripts/validate-pipeline-contract.py
          python pipeline/scripts/test-retry-policy.py

      - name: Validate shell scripts
        run: bash -n pipeline/scripts/*.sh

      - name: Validate Docker Compose interpolation
        run: |
          cp .env.example .env
          docker compose --env-file .env -f pipeline/docker-compose.yml config >/dev/null

      - name: Check internal Markdown links
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('.')
          missing = []
          for path in root.rglob('*.md'):
              text = path.read_text(encoding='utf-8')
              for target in re.findall(r'\[[^]]+\]\(([^)#]+)(?:#[^)]+)?\)', text):
                  if '://' in target or target.startswith('mailto:'):
                      continue
                  candidate = (path.parent / target).resolve()
                  if not candidate.exists():
                      missing.append(f'{path}: {target}')
          if missing:
              print('\n'.join(missing))
              sys.exit('Broken internal Markdown links found')
          PY

      - name: Reject committed placeholder secrets
        run: |
          if grep -RInE 'CHANGEME|<server-ip>|password[=:][[:space:]]*secret' \
              --exclude-dir=.git --exclude='.env.example' --exclude='validate.yml' .; then
            echo 'Unsafe placeholder found outside approved templates.'
            exit 1
          fi

  state-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: media_state
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d media_state"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Run state schema integration test
        env:
          STATE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/media_state
        run: bash pipeline/scripts/test-state-schema.sh
