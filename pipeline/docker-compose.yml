# Docker Compose — hạ tầng local/staging cho pipeline nội dung
#
# Quick start:
#   cp .env.example .env
#   # thay mọi giá trị replace-* trong .env
#   docker compose --env-file .env up -d
#
# Đây chưa phải cấu hình production: dùng reverse proxy/TLS ở phía trước,
# không bind port quản trị ra Internet và phải kiểm thử backup/restore trước pilot.

services:
  postgres-n8n:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in .env}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${N8N_DB_USER:?Set N8N_DB_USER in .env}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env}
      POSTGRES_DB: ${N8N_DB_NAME:?Set N8N_DB_NAME in .env}
    volumes:
      - n8n_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-postiz:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in .env}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTIZ_DB_USER:?Set POSTIZ_DB_USER in .env}
      POSTGRES_PASSWORD: ${POSTIZ_DB_PASSWORD:?Set POSTIZ_DB_PASSWORD in .env}
      POSTGRES_DB: ${POSTIZ_DB_NAME:?Set POSTIZ_DB_NAME in .env}
    volumes:
      - postiz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE in .env}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: ${N8N_IMAGE:?Set N8N_IMAGE in .env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: ${N8N_HOST:?Set N8N_HOST in .env}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres-n8n
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:?Set N8N_DB_NAME in .env}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:?Set N8N_DB_USER in .env}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env}
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres-n8n:
        condition: service_healthy

  postiz:
    image: ${POSTIZ_IMAGE:?Set POSTIZ_IMAGE in .env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTIZ_PORT:-5000}:5000"
    environment:
      DATABASE_URL: postgresql://${POSTIZ_DB_USER:?Set POSTIZ_DB_USER in .env}:${POSTIZ_DB_PASSWORD:?Set POSTIZ_DB_PASSWORD in .env}@postgres-postiz:5432/${POSTIZ_DB_NAME:?Set POSTIZ_DB_NAME in .env}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${POSTIZ_JWT_SECRET:?Set POSTIZ_JWT_SECRET in .env}
      FRONTEND_URL: ${POSTIZ_FRONTEND_URL:?Set POSTIZ_FRONTEND_URL in .env}
      BACKEND_URL: ${POSTIZ_BACKEND_URL:?Set POSTIZ_BACKEND_URL in .env}
    depends_on:
      postgres-postiz:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  n8n_pgdata:
  postiz_pgdata:
  redisdata:
  n8n_data:
